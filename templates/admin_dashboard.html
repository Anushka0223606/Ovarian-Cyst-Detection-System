<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between mb-5">

        <h1>
            Admin Dashboard
        </h1>

        <a href="/admin_logout"
        class="btn btn-danger">

            Logout

        </a>

    </div>

    <!-- Stats -->
    <div class="row g-4 mb-5">

        <div class="col-md-6">

            <div class="dashboard-card">

                <h3>Total Users</h3>

                <h1>{{ total_users }}</h1>

            </div>

        </div>

        <div class="col-md-6">

            <div class="dashboard-card">

                <h3>Total Predictions</h3>

                <h1>{{ total_predictions }}</h1>

            </div>

        </div>

    </div>

    <!-- Prediction Table -->
    <table class="table table-bordered table-striped">

        <thead>

            <tr>

                <th>ID</th>

                <th>Image</th>

                <th>Result</th>

                <th>Confidence</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            {% for item in predictions %}

            <tr>

                <td>{{ item[0] }}</td>

                <td>
                    <img src="{{ item[2] }}"
                    width="100">
                </td>

                <td>{{ item[3] }}</td>

                <td>{{ item[4] }}%</td>

                <td>

                    <a href="/delete_prediction/{{ item[0] }}"
                    class="btn btn-danger btn-sm">

                        Delete

                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
