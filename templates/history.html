
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Prediction History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container py-5">

    <h1 class="mb-5">
        Scan History
    </h1>

    <table class="table table-bordered table-striped">

        <thead>

            <tr>
                <th>ID</th>
                <th>Image</th>
                <th>Result</th>
                <th>Confidence</th>
                <th>Date</th>
            </tr>

        </thead>

        <tbody>

            {% for item in predictions %}

            <tr>

                <td>{{ item[0] }}</td>

                <td>
                    <img src="{{ item[2] }}"
                    width="120">
                </td>

                <td>{{ item[3] }}</td>

                <td>{{ item[4] }}%</td>

                <td>{{ item[5] }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
