<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Medical Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container py-5">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-5">

        <h1 class="dashboard-title">
            Welcome, {{ name }}
        </h1>

        <!-- <a href="/logout" class="btn btn-danger">
            Logout
        </a> -->

    </div>
    <div class="mt-4">

    <a href="/" class="btn btn-primary me-2">
        Home
    </a>

    <a href="/history" class="btn btn-success me-2">
        History
    </a>

    <a href="/logout" class="btn btn-danger">
        Logout
    </a>

</div>

    <!-- Statistics Cards -->
    <div class="row g-4">

        <!-- Total Scans -->
        <div class="col-md-4">

            <div class="dashboard-card">

                <h3>Total Scans</h3>

                <h1>{{ total_scans }}</h1>

            </div>

        </div>

        <!-- Healthy Cases -->
        <div class="col-md-4">

            <div class="dashboard-card">

                <h3>Healthy Cases</h3>

                <h1>{{ healthy_cases }}</h1>

            </div>

        </div>

        <!-- Cyst Cases -->
        <div class="col-md-4">

            <div class="dashboard-card">

                <h3>Cyst Cases</h3>

                <h1>{{ cyst_cases }}</h1>

            </div>

        </div>

    </div>

    <!-- Buttons -->
    <div class="mt-5">

        <a href="/upload" class="btn btn-primary me-3">
            Upload New Scan
        </a>

        <a href="/history" class="btn btn-success">
            View History
        </a>

    </div>

    <!-- Chart Section -->
    <div class="chart-container mt-5">

        <div class="chart-card">

            <h2 class="mb-4 text-center">
                Scan Analytics
            </h2>

            <canvas id="myChart"></canvas>

        </div>

    </div>

</div>

<script>

const ctx = document.getElementById('myChart');

new Chart(ctx, {

    type: 'pie',

    data: {

        labels: [
            'Healthy',
            'Cyst'
        ],

        datasets: [{

            label: 'Cases',

            data: [
                {{ healthy_cases }},
                {{ cyst_cases }}
            ],

            borderWidth: 2

        }]
    }
});

</script>

</body>
</html>
