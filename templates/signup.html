        <form action="/signup" method="POST">

    <div class="mb-3">
        <input type="text"
        class="form-control"
        name="name"
        placeholder="Full Name"
        required>
    </div>

    <div class="mb-3">
        <input type="email"
        class="form-control"
        name="email"
        placeholder="Email"
        required>
    </div>

    <div class="mb-3">
        <input type="password"
        class="form-control"
        name="password"
        placeholder="Password"
        required>
    </div>

    <button class="btn btn-primary w-100">
        Signup
    </button>

</form>



        <p class="text-center mt-3">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</div>
